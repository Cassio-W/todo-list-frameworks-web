<div class="main">
  <h1>Cássio Weissheimer RA: 254748 Bernardo Rocha RA: 258993</h1>
  <input class="lg-text-input" #campoNovoItem
    (keyup.enter)="CREATE_tarefa(campoNovoItem.value); campoNovoItem.value = '' " />
  <button class="btn-primary" (click)="CREATE_tarefa(campoNovoItem.value)">Adicionar Tarefa</button>
  <ul>
    <li *ngFor="let tarefaDoLoop of arrayDeTarefas()">
      <app-item [tarefa]="tarefaDoLoop" (removeTarefa)="DELETE_tarefa(tarefaDoLoop)"
        (modificaTarefa)="UPDATE_tarefa(tarefaDoLoop)"></app-item>
    </li>
  </ul>
</div>
